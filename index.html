<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ben's Web Hero</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79b9e8;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  z-index:10;
  top:15px;
  left:15px;
  padding:14px 18px;
  color:white;
  background:rgba(0,0,0,.7);
  border-radius:12px;
  line-height:1.5;
  pointer-events:none;
}

#hud b{
  color:#ff4040;
}

#status{
  color:#70d8ff;
}

#crosshair{
  position:fixed;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:24px;
  pointer-events:none;
}

#message{
  position:fixed;
  z-index:10;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  background:rgba(0,0,0,.65);
  padding:10px 18px;
  border-radius:10px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">
  🕷️ <b>BEN'S WEB HERO</b><br>
  WASD — Move<br>
  SPACE — Jump<br>
  Mouse — Look<br>
  Left Click — Web<br>
  <span id="status">Web: Ready</span>
</div>

<div id="crosshair">+</div>

<div id="message">
  Click the screen to enable mouse look
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ============================================================
// BASIC SETUP
// ============================================================

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x78b8e8);

scene.fog =
  new THREE.Fog(
    0x78b8e8,
    90,
    260
  );


const camera =
  new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    .1,
    600
  );


const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  70,
  110,
  40
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;

scene.add(sun);


const skyLight =
  new THREE.HemisphereLight(
    0xbfe6ff,
    0x222233,
    1.5
  );

scene.add(skyLight);


// ============================================================
// GROUND
// ============================================================

const ground =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      500,
      1,
      500
    ),
    new THREE.MeshStandardMaterial({
      color:0x35393e,
      roughness:.95
    })
  );

ground.position.y=-.5;

ground.receiveShadow=true;

scene.add(ground);


// ============================================================
// ROADS
// ============================================================

const roadMaterial =
  new THREE.MeshStandardMaterial({
    color:0x17191c,
    roughness:1
  });


for(let x=-120;x<=120;x+=40){

  const road =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        12,
        .06,
        500
      ),
      roadMaterial
    );

  road.position.set(
    x,
    .03,
    0
  );

  scene.add(road);
}


for(let z=-120;z<=120;z+=40){

  const road =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        500,
        .06,
        12
      ),
      roadMaterial
    );

  road.position.set(
    0,
    .04,
    z
  );

  scene.add(road);
}


// ============================================================
// BUILDINGS
// ============================================================

const buildings=[];

const buildingMaterials=[
  new THREE.MeshStandardMaterial({
    color:0x596572,
    roughness:.8
  }),

  new THREE.MeshStandardMaterial({
    color:0x716d69,
    roughness:.85
  }),

  new THREE.MeshStandardMaterial({
    color:0x4d5865,
    roughness:.8
  }),

  new THREE.MeshStandardMaterial({
    color:0x807a75,
    roughness:.85
  })
];


function createBuilding(
  x,
  z,
  width,
  height,
  depth
){

  const material =
    buildingMaterials[
      Math.floor(
        Math.random() *
        buildingMaterials.length
      )
    ];


  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      material
    );


  building.position.set(
    x,
    height/2,
    z
  );


  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);

  buildings.push(building);


  // Windows

  const windowMaterial =
    new THREE.MeshStandardMaterial({
      color:0xffdc7a,
      emissive:0x4b3900,
      roughness:.3
    });


  const rows =
    Math.floor(
      height/3.5
    );


  const cols =
    Math.max(
      1,
      Math.floor(
        width/2.5
      )
    );


  for(
    let row=0;
    row<rows;
    row++
  ){

    for(
      let col=0;
      col<cols;
      col++
    ){

      if(Math.random()<.15)
        continue;


      const window =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            1,
            1.35,
            .08
          ),
          windowMaterial
        );


      window.position.set(
        x-width/2+
          1.4+
          col*2.5,

        2+
          row*3.5,

        z-depth/2-.05
      );


      scene.add(window);
    }
  }
}


// City

const city=[
  [-55,-55,22,55,22],
  [-15,-55,18,38,18],
  [25,-55,25,70,22],

  [-55,-15,25,80,22],
  [55,-15,20,55,20],

  [-55,25,22,45,22],
  [55,25,25,75,25],

  [-55,65,20,65,20],
  [-15,65,25,90,22],
  [25,65,18,50,18],

  [-100,-30,25,65,25],
  [100,30,25,80,25],

  [-100,50,22,50,22],
  [100,-50,22,65,22]
];


for(const b of city){
  createBuilding(...b);
}


// ============================================================
// STREET LIGHTS
// ============================================================

function createStreetLight(x,z){

  const pole =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .12,
        .12,
        5
      ),
      new THREE.MeshStandardMaterial({
        color:0x202328
      })
    );

  pole.position.set(
    x,
    2.5,
    z
  );

  pole.castShadow=true;

  scene.add(pole);


  const lamp =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .3,
        12,
        12
      ),
      new THREE.MeshStandardMaterial({
        color:0xffffbb,
        emissive:0x555500
      })
    );

  lamp.position.set(
    x,
    5.1,
    z
  );

  scene.add(lamp);
}


for(
  let x=-100;
  x<=100;
  x+=40
){

  for(
    let z=-100;
    z<=100;
    z+=40
  ){

    createStreetLight(
      x+7,
      z+7
    );
  }
}


// ============================================================
// HERO
// ============================================================

const hero =
  new THREE.Group();

scene.add(hero);


// Materials

const red =
  new THREE.MeshStandardMaterial({
    color:0xc91d26,
    roughness:.65
  });

const blue =
  new THREE.MeshStandardMaterial({
    color:0x111d7c,
    roughness:.7
  });

const white =
  new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:.25
  });


// Torso

const torso =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.15,
      1.65,
      .65
    ),
    red
  );

torso.position.y=2.55;

torso.castShadow=true;

hero.add(torso);


// Head

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .52,
      24,
      24
    ),
    red
  );

head.position.y=3.75;

head.castShadow=true;

hero.add(head);


// Eyes

for(const x of [-.19,.19]){

  const eye =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .13,
        12,
        12
      ),
      white
    );

  eye.scale.set(
    .7,
    1.4,
    .25
  );

  eye.position.set(
    x,
    3.82,
    -.47
  );

  hero.add(eye);
}


// Hips

const hips =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .9,
      .45,
      .6
    ),
    blue
  );

hips.position.y=1.65;

hips.castShadow=true;

hero.add(hips);


// ============================================================
// LIMBS
// ============================================================

function makeLimb(
  material,
  width,
  height,
  depth
){

  const pivot =
    new THREE.Group();


  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      material
    );


  mesh.position.y=
    -height/2;


  mesh.castShadow=true;

  pivot.add(mesh);

  hero.add(pivot);

  return pivot;
}


const leftLeg =
  makeLimb(
    blue,
    .38,
    1.55,
    .45
  );


const rightLeg =
  makeLimb(
    blue,
    .38,
    1.55,
    .45
  );


leftLeg.position.set(
  -.3,
  1.55,
  0
);


rightLeg.position.set(
  .3,
  1.55,
  0
);


const leftArm =
  makeLimb(
    red,
    .34,
    1.45,
    .4
  );


const rightArm =
  makeLimb(
    red,
    .34,
    1.45,
    .4
  );


leftArm.position.set(
  -.72,
  3.15,
  0
);


rightArm.position.set(
  .72,
  3.15,
  0
);


// Hands

const handGeometry =
  new THREE.SphereGeometry(
    .23,
    12,
    12
  );


const leftHand =
  new THREE.Mesh(
    handGeometry,
    red
  );


const rightHand =
  new THREE.Mesh(
    handGeometry,
    red
  );


leftHand.position.y=-1.5;
rightHand.position.y=-1.5;


leftArm.add(leftHand);
rightArm.add(rightHand);


// ============================================================
// PLAYER PHYSICS
// ============================================================

const velocity =
  new THREE.Vector3();

let grounded=true;

const gravity=25;

const jumpPower=9;

const walkSpeed=10;


// ============================================================
// KEYBOARD
// ============================================================

const keys={};

addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;


    if(
      e.code==="Space" &&
      grounded
    ){

      velocity.y=
        jumpPower;

      grounded=false;
    }
  }
);


addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


// ============================================================
// CAMERA / MOUSE
// ============================================================

let yaw=0;

let pitch=.18;

let mouseLooking=false;


renderer.domElement.addEventListener(
  "click",
  ()=>{

    if(
      document.pointerLockElement !==
      renderer.domElement
    ){

      renderer.domElement.requestPointerLock();

    }

  }
);


document.addEventListener(
  "pointerlockchange",
  ()=>{

    mouseLooking =
      document.pointerLockElement ===
      renderer.domElement;


    document.getElementById(
      "message"
    ).textContent =
      mouseLooking
      ? "Mouse look enabled"
      : "Click the screen to enable mouse look";
  }
);


document.addEventListener(
  "mousemove",
  e=>{

    if(!mouseLooking)
      return;


    yaw -=
      e.movementX*.0025;


    pitch -=
      e.movementY*.0025;


    pitch =
      THREE.MathUtils.clamp(
        pitch,
        -.55,
        .65
      );
  }
);


// ============================================================
// WEB SYSTEM
// ============================================================

let webAttached=false;

let webPoint=null;

let ropeLength=0;

let webLine=null;


const webMaterial =
  new THREE.LineBasicMaterial({
    color:0xffffff
  });


function webOrigin(){

  return hero.localToWorld(
    new THREE.Vector3(
      .72,
      1.55,
      -.15
    )
  );
}


function shootWeb(){

  // Clicking while attached releases it

  if(webAttached){

    releaseWeb();

    return;
  }


  const raycaster =
    new THREE.Raycaster();


  // Fire toward camera crosshair

  const direction =
    new THREE.Vector3(
      0,
      0,
      -1
    );


  direction.applyQuaternion(
    camera.quaternion
  );


  // Start near the hero

  const origin =
    webOrigin();


  raycaster.set(
    origin,
    direction
  );


  const hits =
    raycaster.intersectObjects(
      buildings,
      false
    );


  if(hits.length===0){

    document.getElementById(
      "status"
    ).textContent=
      "Web: Aim at a building";

    return;
  }


  webPoint =
    hits[0].point.clone();


  ropeLength =
    origin.distanceTo(
      webPoint
    );


  // Don't allow absurdly short ropes

  ropeLength =
    Math.max(
      ropeLength,
      4
    );


  webAttached=true;


  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints([
        origin,
        webPoint
      ]);


  webLine =
    new THREE.Line(
      geometry,
      webMaterial
    );


  scene.add(webLine);


  document.getElementById(
    "status"
  ).textContent=
    "Web: ATTACHED";
}


function releaseWeb(){

  webAttached=false;


  if(webLine){

    scene.remove(
      webLine
    );

    webLine.geometry.dispose();

    webLine=null;
  }


  document.getElementById(
    "status"
  ).textContent=
    "Web: Ready";
}


// ============================================================
// CLICK HANDLING
// ============================================================

renderer.domElement.addEventListener(
  "mousedown",
  e=>{

    if(e.button!==0)
      return;


    e.preventDefault();


    // If mouse isn't locked, the first click
    // only enables mouse look.
    if(!mouseLooking){

      renderer.domElement.requestPointerLock();

      return;
    }


    shootWeb();
  }
);


// ============================================================
// MOVEMENT
// ============================================================

function updateMovement(dt){

  const forward =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  const direction =
    new THREE.Vector3();


  if(keys.KeyW)
    direction.add(forward);

  if(keys.KeyS)
    direction.sub(forward);

  if(keys.KeyD)
    direction.add(right);

  if(keys.KeyA)
    direction.sub(right);


  if(direction.lengthSq()>0){

    direction.normalize();


    const target =
      direction.clone()
        .multiplyScalar(
          walkSpeed
        );


    const acceleration =
      grounded
      ? 18
      : 5;


    velocity.x +=
      (target.x-velocity.x)*
      Math.min(
        1,
        acceleration*dt
      );


    velocity.z +=
      (target.z-velocity.z)*
      Math.min(
        1,
        acceleration*dt
      );


    // Rotate hero

    const desiredAngle =
      Math.atan2(
        direction.x,
        direction.z
      );


    let difference =
      desiredAngle -
      hero.rotation.y;


    while(
      difference>Math.PI
    )
      difference-=Math.PI*2;


    while(
      difference<-Math.PI
    )
      difference+=Math.PI*2;


    hero.rotation.y +=
      difference*
      Math.min(
        1,
        dt*10
      );

  }
  else if(grounded){

    velocity.x *=
      Math.pow(
        .0001,
        dt
      );

    velocity.z *=
      Math.pow(
        .0001,
        dt
      );
  }
}


// ============================================================
// SWING PHYSICS
// ============================================================

function updateSwing(dt){

  if(!webAttached)
    return;


  const origin =
    webOrigin();


  const rope =
    new THREE.Vector3()
      .subVectors(
        origin,
        webPoint
      );


  const distance =
    rope.length();


  if(distance>ropeLength){

    const normal =
      rope.normalize();


    const excess =
      distance-ropeLength;


    // Put player back on rope sphere

    hero.position.add(
      normal.clone()
        .multiplyScalar(
          -excess
        )
    );


    // Remove velocity going outward

    const radialSpeed =
      velocity.dot(normal);


    if(radialSpeed>0){

      velocity.sub(
        normal.clone()
          .multiplyScalar(
            radialSpeed
          )
      );
    }
  }


  // Slight air resistance

  velocity.multiplyScalar(
    Math.pow(
      .999,
      dt*60
    )
  );


  // Update visible web

  if(webLine){

    const positions =
      webLine.geometry
        .attributes
        .position
        .array;


    const newOrigin =
      webOrigin();


    positions[0]=newOrigin.x;
    positions[1]=newOrigin.y;
    positions[2]=newOrigin.z;


    positions[3]=webPoint.x;
    positions[4]=webPoint.y;
    positions[5]=webPoint.z;


    webLine.geometry
      .attributes
      .position
      .needsUpdate=true;
  }
}


// ============================================================
// CHARACTER ANIMATION
// ============================================================

let animationTime=0;


function animateHero(dt){

  const speed =
    Math.sqrt(
      velocity.x*velocity.x+
      velocity.z*velocity.z
    );


  if(speed>.5){

    animationTime +=
      dt*speed*1.1;


    const swing =
      Math.sin(
        animationTime
      )*.65;


    leftLeg.rotation.x =
      swing;


    rightLeg.rotation.x =
      -swing;


    leftArm.rotation.x =
      -swing*.8;


    rightArm.rotation.x =
      swing*.8;

  }
  else{

    leftLeg.rotation.x =
      THREE.MathUtils.lerp(
        leftLeg.rotation.x,
        0,
        dt*8
      );


    rightLeg.rotation.x =
      THREE.MathUtils.lerp(
        rightLeg.rotation.x,
        0,
        dt*8
      );


    leftArm.rotation.x =
      THREE.MathUtils.lerp(
        leftArm.rotation.x,
        0,
        dt*8
      );


    rightArm.rotation.x =
      THREE.MathUtils.lerp(
        rightArm.rotation.x,
        0,
        dt*8
      );
  }


  // Arms forward while web-swinging

  if(webAttached){

    leftArm.rotation.x =
      -1.25;

    rightArm.rotation.x =
      -1.25;

    leftArm.rotation.z =
      -.2;

    rightArm.rotation.z =
      .2;

  }
  else{

    leftArm.rotation.z =
      THREE.MathUtils.lerp(
        leftArm.rotation.z,
        0,
        dt*8
      );


    rightArm.rotation.z =
      THREE.MathUtils.lerp(
        rightArm.rotation.z,
        0,
        dt*8
      );
  }
}


// ============================================================
// CAMERA
// ============================================================

function updateCamera(dt){

  const target =
    hero.position.clone();


  target.y += 2.3;


  const distance=8;


  const offset =
    new THREE.Vector3(
      Math.sin(yaw)*
      Math.cos(pitch)*
      distance,

      Math.sin(pitch)*
      distance+2,

      Math.cos(yaw)*
      Math.cos(pitch)*
      distance
    );


  const desired =
    target.clone()
      .add(offset);


  camera.position.lerp(
    desired,
    Math.min(
      1,
      dt*7
    )
  );


  camera.lookAt(
    target
  );
}


// ============================================================
// MAIN LOOP
// ============================================================

let previous =
  performance.now();


function gameLoop(){

  requestAnimationFrame(
    gameLoop
  );


  const now =
    performance.now();


  let dt =
    (now-previous)/1000;


  previous=now;


  dt =
    Math.min(
      dt,
      .033
    );


  updateMovement(dt);


  // Gravity

  velocity.y -=
    gravity*dt;


  // Web constraint

  updateSwing(dt);


  // Move

  hero.position.x +=
    velocity.x*dt;


  hero.position.y +=
    velocity.y*dt;


  hero.position.z +=
    velocity.z*dt;


  // Ground collision

  if(hero.position.y<=0){

    hero.position.y=0;


    if(velocity.y<0)
      velocity.y=0;


    grounded=true;

  }
  else{

    grounded=false;
  }


  // World boundary

  hero.position.x =
    THREE.MathUtils.clamp(
      hero.position.x,
      -235,
      235
    );


  hero.position.z =
    THREE.MathUtils.clamp(
      hero.position.z,
      -235,
      235
    );


  animateHero(dt);

  updateCamera(dt);


  renderer.render(
    scene,
    camera
  );
}


gameLoop();


// ============================================================
// RESIZE
// ============================================================

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
</html>
